<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nerveship.net</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/webp" href="/green_spiral_favi.webp">
</head>
<body>
  <div class="container">
    <div class="scrolling-text">
        <marquee behavior="scroll" direction="left" scrollamount="12"> Friends of nerveship.net
        </marquee>
      </div>
    <div class="inner">
      <div class="header">
        <h1>nerveship.net</h1>
      </div>

      <div class="navbar">

        <div class="dropdown">
          <button class="dropbtn">Main</button>
          <div class="dropdown-content">
            <a href="/">Home</a>
            <a href="/about">About</a>
          </div>
        </div>

        <div class="dropdown">
          <button class="dropbtn">Art</button>
          <div class="dropdown-content">
            <a href="/games">Games</a>
            <a href="/artlog">Artlog</a>
          </div>
        </div>

        <div class="dropdown">
          <button class="dropbtn">Writing</button>
          <div class="dropdown-content">
            <a href="https://blog.nerveship.net/">Blog</a>
          </div>
        </div>

        <div class="dropdown">
          <button class="dropbtn">Community</button>
          <div class="dropdown-content">
            <a href="/friends">Friends</a>
          </div>
        </div>

        <div class="dropdown">
          <button class="dropbtn">Archive</button>
          <div class="dropdown-content">
            <a href="/archive/homepages">Homepages</a>
          </div>
        </div>

      </div>
      <div class="landing">
        <p>Here are some websites owned by my friends. Please help me make this section larger and create your own website today!</p><br>
        
        <div class="friend-links">
          <a href="https://luminal.zone/home/" target="_blank"><b>bilexth/moga</b></a><br>
          <a href="https://rabiesarcade.neocities.org/" target="_blank"><b>rabiesarcade</b></a>
        </div>
        
        <img src="grave-crop.png" width="100%" alt="Grave banner">
      </div>
      <div class="bottom-text">
        <p>With lots of love.</p>
      </div>
    </div>
  </div>

  <script src="/index.js"></script>
</body>
</html>
